  <!-- ios install guide odal -->
  <div class="modal fade pwa-modal" id="iosPwaModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <!-- HEADER -->
        <div class="modal-header">
          <h5 class="modal-title">
            📲 Install App
          </h5>
          <button type="button" class="close-btn" data-bs-dismiss="modal">
            ✕
          </button>
        </div>

        <!-- BODY -->
        <div class="modal-body">

          <p class="intro">
            Add ScoreX to your home screen for faster access 🚀
          </p>

          <div class="steps">

            <div class="step">
              <div class="step-icon">📤</div>
              <div>
                <strong>Tap Share</strong>
                <p>
                  Safari → bottom bar<br>
                  Chrome → top bar
                </p>
              </div>
            </div>

            <div class="step">
              <div class="step-icon">➕</div>
              <div>
                <strong>Add to Home Screen</strong>
                <p>Scroll and select the option</p>
              </div>
            </div>

            <div class="step">
              <div class="step-icon">✅</div>
              <div>
                <strong>Tap Add</strong>
                <p>Your app will appear instantly</p>
              </div>
            </div>

          </div>

          <div class="note">
            Works like a real app with full-screen experience.
          </div>

        </div>

        <!-- FOOTER -->
        <div class="modal-footer">
          <button class="primary-btn" data-bs-dismiss="modal">
            Got it
          </button>
        </div>

      </div>
    </div>

  </div>
<!-- app modal styling -->
<style media="screen">
  /* MODAL BACKDROP */
  .pwa-modal .modal-content {
    background: linear-gradient(145deg, rgba(1,7,33,0.95), rgba(1,7,33,0.85));
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.05);
    color: #fff;
    backdrop-filter: blur(10px);
  }

  /* HEADER */
  .pwa-modal .modal-header {
    border-bottom: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .pwa-modal .modal-title {
    font-weight: 700;
    font-size: 16px;
  }

  /* CLOSE BUTTON */
  .close-btn {
    background: rgba(255,255,255,0.05);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
  }

  /* BODY */
  .pwa-modal .modal-body {
    padding-top: 0;
  }

  /* INTRO */
  .intro {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  /* STEPS */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* STEP */
  .step {
    display: flex;
    gap: 12px;
    align-items: flex-start;

    background: rgba(255,255,255,0.04);
    padding: 10px;
    border-radius: 12px;
  }

  /* ICON */
  .step-icon {
    width: 34px;
    height: 34px;

    border-radius: 10px;
    background: rgba(0,149,255,0.15);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
  }

  /* TEXT */
  .step strong {
    font-size: 13px;
  }

  .step p {
    margin: 2px 0 0;
    font-size: 11px;
    color: #94a3b8;
  }

  /* NOTE */
  .note {
    margin-top: 14px;
    padding: 10px;
    border-radius: 10px;

    background: rgba(255,190,27,0.1);
    color: #ffbe1b;
    font-size: 12px;
  }

  /* FOOTER */
  .pwa-modal .modal-footer {
    border-top: none;
  }

  /* BUTTON */
  .primary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;

    background: linear-gradient(135deg,#0095FF,#ffbe1b);
    color: #000;

    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .primary-btn:hover {
    transform: scale(1.03);
  }

  /* MOBILE */
  @media (max-width: 480px) {
  .step {
    padding: 8px;
  }

  .step-icon {
    width: 30px;
    height: 30px;
  }
  }
</style>
