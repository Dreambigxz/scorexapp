<div class="betslip" [class.show]="matchService.isSlipVisible">

  <!-- HEADER -->
  <div class="betslip-header" *ngIf="matchService.addingFixture" (click)="matchService.toggleSlip()">
    <span class="title">Bet Slip</span>
    <button class="close-btn">Close</button>
  </div>

  <!-- CONTENT -->
  <div class="betslip-body" *ngIf="matchService.addingFixture; else loadBooking">

    <!-- MATCH INFO -->
    <div class="match-info" *ngIf="matchService.addingFixture as fx">
      <div class="teams">
        <span>{{fx.fixture.teams.home.name}}</span>
        <span class="vs">vs</span>
        <span>{{fx.fixture.teams.away.name}}</span>
      </div>

      <div class="odds">
        <span class="score">{{fx.selectedScore.value}}</span>
        <span class="percent">{{fx.selectedScore.odds}}%</span>
      </div>
    </div>

    <!-- INPUT -->
    <div class="stake-box">
      <input
        [(ngModel)]="matchService.stakeAmount"
        (keyup)="matchService.stakeAmountHandler($event)"
        placeholder="Enter amount"
        type="number"
      />
      <button (click)="matchService.stakeAll()">All</button>
    </div>

    <!-- QUICK AMOUNTS -->
    <div class="quick-amounts" *ngIf="storeData.store['wallet']">
      <span
        *ngFor="let amt of amounts"
        [class.active]="selectedAmount === amt"
        (click)="selectAmount(amt)">
        {{ amt | currencyConverter | number }}
      </span>
    </div>

    <!-- RESULT -->
    <div class="summary">
      <span>Total win</span>
      <strong>
        {{storeData.store['wallet']?.init_currency.symbol}}
        {{matchService.possibleWin | number:'1.2-2'}}
      </strong>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="primary" (click)="matchService.slipHandler('trade_bet!')">
        Continue
      </button>

      <button class="secondary"
        *ngIf="storeData.store['is_staff']"
        (click)="matchService.slipHandler('book_bet')">
        Company Bet
      </button>

      <!-- <button class="secondary"
        *ngIf="storeData.store['is_staff']"
        (click)="matchService.slipHandler('extra_bet')">
        Bonus Bet
      </button> -->
    </div>

  </div>

  <!-- LOAD -->
  <ng-template #loadBooking>
    <!-- <div class="betslip-body">
      <div class="stake-box">
        <input placeholder="Coupon code" type="text" />
      </div>
      <button class="primary">Load</button>
    </div> -->
  </ng-template>

</div>
