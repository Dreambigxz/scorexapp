<app-header2></app-header2>
<app-betslip *ngIf="matchService.isSlipVisible"></app-betslip>
<app-spinner></app-spinner>


<div class="page page-wrapper">


  <section class="match-container">

      <ng-container *ngIf="fixture; else expiredFixture">

        <ng-container *ngIf="fixture.fixture.fixture.timestamp | countdown | async as time; else expiredFixture">

          <!-- HEADER -->
          <div class="match-header">

            <div class="match-meta">
              <span class="time">
                Today {{fixture.fixture.fixture.timestamp | timeFormat}}
              </span>
              <span class="league">
                {{fixture.fixture.league.name}} • {{fixture.fixture.league.country}}
              </span>
            </div>

            <div class="teams">
              <span class="team">{{fixture.fixture.teams.home.name}}</span>
              <span class="vs">vs</span>
              <span class="team">{{fixture.fixture.teams.away.name}}</span>
            </div>

          </div>

          <!-- ODDS TABLE -->
          <div class="odds-card">

            <div class="odds-header">
              <span>Home</span>
              <span>Draw</span>
              <span>Away</span>
            </div>

            <div *ngFor="let row of predictionRows" class="odds-row">

              <div
                *ngFor="let odd of row"
                class="odds-cell"
                (click)="matchService.showBetSlip(fixture,{odds:odd.odds,value:odd.value}); activeRow=odd.value; activeID=fixture.fixtureID"
                [class.active]="activeRow===odd.value && activeID===fixture.fixtureID"
                [class.disabled]="!odd.value || odd.value==='-' || excludeScores.includes(odd.value)"
              >

                <div *ngIf="odd.value && odd.value !== '-' && !excludeScores.includes(odd.value)">
                  <span class="score">{{ odd.value }}</span>
                  <span class="value">{{ odd.odds | number:'1.2-2' }}</span>
                </div>

              </div>

            </div>

          </div>

        </ng-container>

      </ng-container>

      </section>


    <section class="app-container">
      <ng-template #expiredFixture>
        <div class="no-data text-center empty-state">
          <img
            [src]="matchService.emptyDataUrl"
            width="60"
            alt="no data"
          />
          <p>Invalid or expired fixture</p>
        </div>
      </ng-template>

    </section>


</div>
