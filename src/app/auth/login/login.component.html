<app-spinner></app-spinner>

<div class="app-container">

  <div class="login-card">

    <!-- Logo -->
    <div class="logo">
      <img src="/assets/images/logo.png" alt="Logo" />
    </div>

    <h1>ScoreX</h1>
    <p (click)="quickNav.go('about-us')" class="subtitle">About us!</p>

    <!-- Language -->
    <div class="input-group select-lang">
      <i class="fa fa-language"></i>

      <select class="notranslate"
        (change)="quickNav.changeLanguage($event)">
        <option disabled selected>Select language</option>
        <option *ngFor="let lang of quickNav.langKeys" [value]="lang">
          {{ lang }}
        </option>
      </select>

      <span class="arrow"></span>
    </div>

    <!-- Form -->
    <form [formGroup]="authService.formView.login"
      (ngSubmit)="authService.onSubmit(authService.formView.login,'login')">

      <!-- Username -->
        <div class="input-box">
          <input type="text" formControlName="identifier" required />
          <label>Username</label>
          <i class="fa fa-user"></i>
        </div>

        <!-- Password -->
        <div class="input-box">
          <input
            [type]="authService.showPassword ? 'text' : 'password'"
            formControlName="password"
            required
          />
          <label>Password</label>

          <i class="fa fa-lock left"></i>

          <i class="fa toggle"
             [ngClass]="authService.showPassword ? 'fa-eye-slash' : 'fa-eye'"
             (click)="authService.togglePassword()">
          </i>
        </div>

      <button class="login-btn"
        type="submit"
        [disabled]="authService.formView.login.invalid">
        Login
      </button>

    </form>

    <div class="links">
      <span (click)="authService.router.navigate(['/reset-password'])">
        Reset Account
      </span>

      <span (click)="authService.router.navigate(['/register'])">
        No account? <b>Register</b>
      </span>
    </div>

  </div>

</div>

<a href="https://t.me/official_scorex"
  target="_blank"
  class="telegram-float">
  <i class="ti ti-brand-telegram"></i>
</a>
